[versions]
agp                  = "8.12.1"
kotlin               = "2.0.21"
stonesdk             = "4.15.0"
composeBom           = "2024.11.00"
navigationCompose    = "2.8.4"
kotlinxSerialization = "1.7.3"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
coroutines           = "1.9.0"
lifecycle            = "2.8.7"
securityCrypto       = "1.1.0-alpha06"
coreKtx              = "1.13.1"
activityCompose      = "1.9.3"

[libraries]
androidx-core-ktx              = { group = "androidx.core",              name = "core-ktx",                  version.ref = "coreKtx" }
androidx-activity-compose      = { group = "androidx.activity",          name = "activity-compose",           version.ref = "activityCompose" }
compose-bom                    = { group = "androidx.compose",           name = "compose-bom",                version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core    = { group = "androidx.compose.material", name = "material-icons-core" }
navigation-compose             = { group = "androidx.navigation",        name = "navigation-compose",         version.ref = "navigationCompose" }
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",version.ref = "lifecycle" }
lifecycle-runtime-ktx          = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
lifecycle-runtime-compose      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",  version.ref = "lifecycle" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }
retrofit                       = { group = "com.squareup.retrofit2",     name = "retrofit",                   version.ref = "retrofit" }
retrofit-converter-gson        = { group = "com.squareup.retrofit2",     name = "converter-gson",             version.ref = "retrofit" }
okhttp-logging                 = { group = "com.squareup.okhttp3",       name = "logging-interceptor",        version.ref = "okhttp" }
security-crypto                = { group = "androidx.security",          name = "security-crypto",            version.ref = "securityCrypto" }
stone-sdk                      = { group = "br.com.stone",               name = "stone-sdk",                  version.ref = "stonesdk" }
stone-sdk-posandroid           = { group = "br.com.stone",               name = "stone-sdk-posandroid",       version.ref = "stonesdk" }
stone-sdk-posandroid-tectoy    = { group = "br.com.stone",               name = "stone-sdk-posandroid-tectoy",   version.ref = "stonesdk" }
stone-sdk-posandroid-ingenico  = { group = "br.com.stone",               name = "stone-sdk-posandroid-ingenico", version.ref = "stonesdk" }
stone-sdk-posandroid-sunmi     = { group = "br.com.stone",               name = "stone-sdk-posandroid-sunmi",    version.ref = "stonesdk" }
stone-sdk-posandroid-gertec    = { group = "br.com.stone",               name = "stone-sdk-posandroid-gertec",   version.ref = "stonesdk" }
stone-sdk-posandroid-positivo  = { group = "br.com.stone",               name = "stone-sdk-posandroid-positivo", version.ref = "stonesdk" }
stone-sdk-debugmode            = { group = "br.com.stone.sdk.android",   name = "debugmode",                  version = "4.0.3" }

[plugins]
android-application    = { id = "com.android.application",          version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose",version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
